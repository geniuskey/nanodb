# NANoDB Evidence Site를 GitHub Pages에 배포한다 (US-08).
# VitePress 정적 사이트(docs/)만 build·배포하며 Core runtime과 무관하다.
# build 성공 후에만 Pages에 배포하고, 최소 권한과 단일 배포를 사용한다.
name: Deploy evidence site

on:
  push:
    branches: [main]
    # 사이트 입력이 바뀔 때만 실행한다.
    paths:
      - 'docs/**'
      - 'screenshots/**'
      # 홈 소개 영상. build 전에 docs/public/video/로 복사되므로 원본이 바뀌면 재배포한다.
      - 'assets/video/**'
      - '.nvmrc'
      - '.github/workflows/deploy-evidence-site.yml'
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한.
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 하나만. 진행 중 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies (locked)
        working-directory: docs
        run: npm ci

      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    # build가 성공한 뒤에만 배포한다. 실제 배포는 main에서만 실행한다.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
