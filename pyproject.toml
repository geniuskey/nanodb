[project]
name = "nanodb-core"
version = "0.1.0"
description = "NANoDB Core hackathon MVP"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.128.8",
  "pillow==11.3.0",
  "psycopg[binary]==3.2.13",
  "pydantic==2.13.5",
  "pydantic-settings==2.11.0",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.39.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]
segmentation = [
    "matplotlib>=3.9",
    "numpy>=2",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/nanodb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src/backend", "."]
testpaths = ["tests/backend"]
markers = [
  "integration: requires an isolated PostgreSQL database",
  "contract: validates an external or serialized contract",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src/backend"
packages = ["nanodb"]

[tool.coverage.run]
source = ["src/backend/nanodb"]

[tool.coverage.report]
show_missing = true
skip_covered = true
